# autopilot-managed thin caller. Weekly retro: repeated failures become reviewed lessons for future agent runs.
name: improve

on:
  schedule:
    - cron: "11 12 * * 0"     # Sundays, ~08:11 ET
  workflow_dispatch:

permissions: {}

jobs:
  improve:
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    uses: RyanJHamby/autopilot/.github/workflows/improve.yml@d036eece2a5db4b1792b4373e9e992479fa7a309
    with:
      kit_repo: RyanJHamby/autopilot
      kit_ref: d036eece2a5db4b1792b4373e9e992479fa7a309
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
