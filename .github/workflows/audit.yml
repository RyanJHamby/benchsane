# autopilot-managed thin caller. Weekly audit: files a few small issues that serve the repo charter, within its caps.
name: audit

on:
  schedule:
    - cron: "43 11 * * 1"     # Mondays, ~07:43 ET
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: RyanJHamby/autopilot/.github/workflows/audit.yml@d036eece2a5db4b1792b4373e9e992479fa7a309
    with:
      kit_repo: RyanJHamby/autopilot
      kit_ref: d036eece2a5db4b1792b4373e9e992479fa7a309
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
