# autopilot-managed thin caller. The logic lives in the pinned kit; change it by bumping the sha below (a PR you merge).
name: guard

on:
  pull_request:
  push:
    branches: ["agent/**"]   # agent pushes use a token that does not fire pull_request CI; this satisfies required checks

permissions: {}

jobs:
  guard:
    permissions:
      contents: read
    uses: RyanJHamby/autopilot/.github/workflows/guard.yml@d036eece2a5db4b1792b4373e9e992479fa7a309
    with:
      kit_repo: RyanJHamby/autopilot
      kit_ref: d036eece2a5db4b1792b4373e9e992479fa7a309
